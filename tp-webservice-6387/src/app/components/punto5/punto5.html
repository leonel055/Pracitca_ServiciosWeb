<div class="page container">
  <header class="page-header">
    <h1 class="page-title">Generador de QR</h1>
    <p class="page-subtitle">Ingresá un texto o URL y obtené tu código QR al instante.</p>
  </header>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="panel text-center">
        <label class="form-label" for="texto-qr">Contenido del QR</label>
        <input
          id="texto-qr"
          type="text"
          class="form-control mb-4"
          name="texto"
          [(ngModel)]="texto"
          placeholder="https://ejemplo.com o cualquier texto"
        />

        <button type="button" class="btn btn-app btn-app-primary mb-4" (click)="generarQR()">
          Generar QR
        </button>

        <div class="qr-wrap" *ngIf="qrBase64">
          <img [src]="qrBase64" alt="Código QR generado" class="qr-image" />
        </div>
      </div>
    </div>
  </div>
</div>
