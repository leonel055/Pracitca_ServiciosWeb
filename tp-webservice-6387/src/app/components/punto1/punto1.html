<div class="page container">
  <header class="page-header">
    <h1 class="page-title">Top películas </h1>
    <p class="page-subtitle">Las 10 mejores películas</p>
  </header>

  <div class="row g-4" *ngIf="peliculas.length > 0; else cargando">
    <div class="col-md-6 col-lg-4" *ngFor="let pelicula of peliculas">
      <article class="movie-card">
        <div class="movie-card-img-wrap">
          <img [src]="pelicula.image" [alt]="pelicula.title" class="movie-card-img" />
          <span class="movie-rating">⭐ {{ pelicula.rating }}</span>
        </div>
        <div class="movie-card-body">
          <h2 class="movie-title">{{ pelicula.title }}</h2>
          <p class="movie-year">{{ pelicula.year }}</p>
          <p class="movie-desc">{{ pelicula.description }}</p>
          <span class="movie-genre">{{ pelicula.genre }}</span>
        </div>
      </article>
    </div>
  </div>

  <ng-template #cargando>
    <p class="loading-text text-center py-5">Cargando películas...</p>
  </ng-template>
</div>
