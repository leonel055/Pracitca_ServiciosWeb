<section class="home">
  <div class="home-hero">
    <div class="container">
      <h1 class="home-title">Web Services</h1>
      <p class="home-lead">
        Consumo de APIs externas con Angular — películas, autos, monedas, audio y códigos QR.
      </p>
    </div>
  </div>

  <div class="container home-grid-wrap">
    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let card of cards">
        <article class="home-card" [style.--card-accent]="card.color">
          <h2 class="home-card-title">{{ card.title }}</h2>
          <p class="home-card-text">{{ card.description }}</p>
          <a [routerLink]="card.link" class="home-card-btn">
            Explorar
            <span aria-hidden="true">→</span>
          </a>
        </article>
      </div>
    </div>
  </div>
</section>
